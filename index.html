<title>監査論 すきまトレーナー</title>
<style>
:root{
  color-scheme:light only;
  --paper:#ECEEE7; --card:#F7F6F1; --ink:#22252A; --sub:#6C7078; --faint:#9A9E9F;
  --line:#D2CFC4; --ao:#2C4F86; --shu:#A4362C; --hold:#8A7430; --midori:#3D6B4F;
  --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
  --gothic:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#ECEEE7 !important}
body{margin:0;padding:0;background:#ECEEE7 !important;color:#22252A !important;
  font-family:var(--gothic);padding-bottom:env(safe-area-inset-bottom);-webkit-text-size-adjust:100%}
#app{max-width:660px;margin:0 auto;padding:0 16px 44px;background:var(--paper);color:var(--ink);min-height:100vh}
@media (prefers-color-scheme:dark){html,body{background:#ECEEE7 !important;color:#22252A !important}
  #app{background:#ECEEE7;color:#22252A}}
h1,h2,h3{font-weight:600;margin:0}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hd{display:flex;align-items:baseline;justify-content:space-between;padding:16px 0 10px}
.hd .ttl{font-size:15px;letter-spacing:.04em}
.hd .sub{font-size:11px;color:var(--faint)}
.rule{height:1px;background:var(--line)}
.stair{display:flex;gap:3px;margin:12px 0 4px}
.stair div{flex:1;text-align:center}
.stair b{display:block;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.stair span{display:block;font-size:9.5px;color:var(--faint);margin-top:2px}
.stair .on b{color:var(--ao)}
.qwrap{margin:14px 0 0}
.tag{display:flex;gap:7px;align-items:center;font-size:11px;color:var(--sub);margin-bottom:10px;flex-wrap:wrap}
.tag .rk{border:1px solid var(--line);border-radius:3px;padding:1px 5px;font-weight:600}
.tag .rk.Ａ{color:var(--shu);border-color:var(--shu)}
.tag .rk.Ｂ{color:var(--ao);border-color:var(--ao)}
.tag .again{background:var(--hold);color:var(--paper);border-radius:3px;padding:1px 5px;font-weight:600}
.tag .hot{background:var(--shu);color:var(--paper);border-radius:3px;padding:1px 5px;font-weight:600}
.tag .kk{background:var(--ao);color:var(--paper);border-radius:3px;padding:1px 5px;font-weight:600}
.tag .sute{border:1px dashed var(--faint);color:var(--faint);border-radius:3px;padding:1px 5px}
.q{font-family:var(--mincho);font-size:17.5px;line-height:1.92;letter-spacing:.01em;
   text-align:justify;word-break:normal;line-break:strict;overflow-wrap:anywhere}
.qn{color:var(--faint);font-size:12px;margin-right:.4em}
.ans{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin:22px 0 0}
.ans button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;

.ans button:active{transform:scale(.97)}
.ans button small{display:block;font-size:10px;font-weight:400;color:var(--faint);margin-top:3px}
.ans .o{color:var(--ao)} .ans .x{color:var(--shu)} .ans .h{color:var(--hold);font-size:19px}
.verdict{margin:20px 0 0;padding-left:13px;border-left:3px solid var(--line)}
.verdict.ok{border-color:var(--ao)} .verdict.ng{border-color:var(--shu)}
.vhead{font-size:13px;font-weight:600;margin-bottom:7px}
.verdict.ok .vhead{color:var(--ao)} .verdict.ng .vhead{color:var(--shu)}
.why{font-family:var(--mincho);font-size:15px;line-height:1.85;text-align:justify}
.arts{font-size:11.5px;color:var(--sub);margin-top:8px}
.disc{margin-top:12px}
.disc>button{display:block;width:100%;text-align:left;border:1px solid var(--line);

.disc>button b{color:var(--ink);font-weight:600}
.body{margin-top:10px;padding:13px;background:var(--card);border-radius:10px;
  font-family:var(--mincho);font-size:14.5px;line-height:1.88;text-align:justify}
.body .src{display:block;font-family:var(--gothic);font-size:10.5px;color:var(--faint);margin-top:10px}
.body .core{font-family:var(--gothic);font-size:13px;font-weight:600;color:var(--ao);
  line-height:1.65;margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.body h4{font-family:var(--gothic);font-size:11.5px;color:var(--faint);font-weight:600;
  margin:13px 0 5px;letter-spacing:.06em}
.body ul{margin:0;padding:0;list-style:none;font-family:var(--gothic);font-size:13px;line-height:1.72}
.body ul li{margin-bottom:6px;padding-left:1.15em;text-indent:-1.15em}
.body ul li:before{content:"・";color:var(--faint)}

.body p:last-child{margin-bottom:0}

.hlnote b{color:var(--hold)}

.next{display:flex;gap:9px;margin-top:20px}

  color:var(--sub);font-weight:400;font-size:12.5px}

.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:6px 0 16px}

.back{font-size:12.5px;color:var(--sub);padding:10px 0;border-bottom:1px solid var(--line);line-height:1.7}
.back b{color:var(--ink);font-weight:600}
.caution{margin-top:10px;padding:10px 12px;border-left:3px solid var(--hold);
  background:var(--card);font-size:11.5px;line-height:1.7;color:var(--sub);border-radius:0 8px 8px 0}
.caution b{color:var(--ink);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:20px;

.chips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
.memo{background:var(--card);border-left:3px solid var(--ao);border-radius:0 10px 10px 0;

.nav{display:flex;gap:16px;padding:16px 0 0;font-size:12.5px;color:var(--sub);
  border-top:1px solid var(--line);margin-top:22px}
.nav button.on{color:var(--ink);font-weight:600}
.big{font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.center{text-align:center;padding:26px 0}
.lead{margin-top:18px;font-family:var(--mincho);font-size:15px;line-height:1.9;text-align:justify}
.alert{background:#F6E3DF;border:1px solid var(--shu);color:var(--shu);border-radius:11px;
  padding:11px 13px;font-size:12px;line-height:1.65;margin:14px 0 0}
.alert b{display:block;font-weight:600;margin-bottom:3px}
textarea{width:100%;min-height:110px;margin-top:9px;padding:10px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:11px;
  font-family:ui-monospace,Menlo,monospace;line-height:1.45;-webkit-user-select:text;user-select:text}
.mini{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;align-items:center}
.mini button{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 13px;font-size:12px}
.mini input[type=date]{border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:9px;padding:7px 10px;font-size:12.5px;font-family:inherit}
.time{display:flex;margin:12px 0 0;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.time div{flex:1;padding:10px 6px;text-align:center;border-right:1px solid var(--line)}
.time div:last-child{border-right:0}
.time b{display:block;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.time span{display:block;font-size:10px;color:var(--faint);margin-top:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--ink);
  color:var(--paper);padding:10px 18px;border-radius:22px;font-size:12.5px;opacity:0;
  pointer-events:none;transition:opacity .2s;z-index:50}
.toast.on{opacity:.95}
.spk{position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));width:50px;height:50px;
  border-radius:25px;background:var(--ink);color:var(--paper);font-size:20px;display:flex;
  align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(0,0,0,.22);z-index:40}
.spk.off{background:var(--card);color:var(--faint);border:1px solid var(--line)}
.wk{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);
  font-size:12.5px;width:100%;text-align:left}
.wk .hz{flex:0 0 46px;font-size:10px;color:var(--paper);background:var(--sub);border-radius:3px;
  text-align:center;padding:2px 0;font-weight:600}
.wk .hz.h3{background:var(--shu)} .wk .hz.h2{background:var(--hold)} .wk .hz.h1{background:var(--sub)}
.wk .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk .sc{font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--sub);flex:0 0 auto}
.wk .sc.bad{color:var(--shu);font-weight:600}
.gl{padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.72}
.gl b{display:block;font-weight:600;font-size:13.5px;margin-bottom:3px}
.subj{display:flex;gap:6px;padding:12px 0 0}
.subj button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:9px;
  padding:8px 4px;font-size:12.5px;color:var(--sub);position:relative;line-height:1.3}
.subj button.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
.subj button i{display:inline-block;font-style:normal;font-size:10px;margin-left:4px;
  background:var(--shu);color:var(--paper);border-radius:8px;padding:1px 5px;font-weight:600}
.subj button.on i{background:var(--paper);color:var(--ink)}
.pick{display:block;text-align:center;background:var(--ink);color:var(--paper);
  border-radius:12px;padding:16px 0;font-size:15px;font-weight:600;margin-top:18px;cursor:pointer}
.pick input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.stepn{display:flex;gap:10px;margin-top:14px;font-size:13px;line-height:1.75}
.stepn>b{flex:0 0 20px;height:20px;border-radius:10px;background:var(--ink);color:var(--paper);
  font-size:11px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.stepn div b{background:none;color:var(--ink);font-weight:600;display:inline;
  flex:none;height:auto;border-radius:0;font-size:inherit;margin:0;padding:0}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";
var CARDS=[], TOPICS=[], CZ=[], MAXW=1, M={}, SH={};
var BYID={}, BYTP={}, TP={};
var APPVER='v14', APPDATE='2026-09-23';
var CHANGES=[
 ['v14','2026-09-23','端末をまたぐ引き継ぎ。4科目の記録をまとめて1つにコピーし、貼り付けるだけで移せるように（ユニバーサルクリップボード）。古い記録で上書きしそうなときは科目ごとに知らせて止める'],
 ['v13','2026-09-21','遅れの判定を「その周で1肢でも解いてから」に変更。日数もcycの開始日ではなく解き始めた日から数えるようにし、1周を終えた直後に遅れ扱いされる不具合を修正'],
 ['v12','2026-09-20','「全科目」を画面上段のタブに移動し、並びを 全科目・管理・企業・財理・監査 に固定'],
 ['v11','2026-09-20','全科目ページで、一度も開き直していない科目の総肢数が0になり、遅れの順番から外れる不具合を修正'],
 ['v10','2026-09-16','企業法の解説を監査版に差し替え（決議の瑕疵・差止請求権・官報公告など5論点を修正）'],
 ['v9','2026-09-15','全科目ページを追加（4科目の進捗・遅れ・勉強時間を一覧。Study Plus 用の書き出しつき）。教材ファイルの版も科目ごとに表示'],
 ['v8','2026-09-15','アプリのバージョン表示と「最新に更新する」を追加。読み込み画面の太字が黒帯になる崩れを修正'],
 ['v7','2026-09-14','企業法に対応（条文の趣旨を肢ごとに表示）。科目別だった旧アプリのバックアップを自動変換して取り込めるように'],
 ['v6','2026-09-13','4科目を1つのアプリに統合。教材を科目ごとに分けて保存するようにし、別科目を読むと前の教材が消える不具合を修正'],
 ['v5','2026-09-12','前日と同じ問題ばかり出る不具合を修正（復習と新規の割合を1日の予定に合わせた）'],
 ['v4','2026-09-11','学習時間に、アプリを閉じている間の時間が加算される不具合を修正。「時間だけ消す」を追加'],
 ['v3','2026-09-10','論点解説を段落に分け、肢に対応する箇所へ色を付けるように。1周日数を途中で変えても正しく日割りされるように修正'],
 ['v2','2026-09-09','「よく出る論点だけ」を追加。捨ててよい肢の判定を精緻化。収録した本試験の回数を教材から読むように'],
 ['v1','2026-09-08','初版（監査論）']
];
var KEY='trainer_state', DKEY='trainer_cards_v1', DVER='';
var DEF={title:'すきまトレーナー',sub:'',ask:'公認会計士短答式の肢です。',
  pools:[{id:'mon',label:'問題集',sub:'',note:''},{id:'all',label:'全部',sub:'',note:''}],
  cz:[],czNote:'',guide:[],cycleNote:'',freqNote:''};
function initData(d){
  if(!d||!d.cards||!d.cards.length)
    throw new Error('問題データが見つかりません。cards.json ではないファイルを選んでいませんか。');
  var mt = d.meta||{};
  var okTopics = d.topics && d.topics.length && d.topics[0] && d.topics[0].c && d.topics[0].kw;
  if(!mt.sig || !okTopics){
    throw new Error('すきまトレーナー用の教材ファイルではないようです（'+d.cards.length+'肢が入っています）。'+
      '他の科目やほかのアプリの cards.json を選んでいませんか。'+
      'ファイル名は 科目名-cards.json、中身には科目名と論点解説が入っている必要があります。');
  }
  var c0 = d.cards[0]||{};
  if(!c0.q || c0.a===undefined || !c0.t)
    throw new Error('問題データの形式が違います（q・a・t が必要です）。');
  M = {}; for(var k in DEF) M[k]=DEF[k];
  for(var k2 in mt) M[k2]=mt[k2];
  if(!M.pools||!M.pools.length) M.pools=DEF.pools;
  CARDS=d.cards; TOPICS=d.topics; CZ=M.cz||[]; MAXW=d.maxw||1; DVER=d.v||M.sig; SH=d.sh||{};
  KEY='trainer_state_'+M.sig;
  BYID={}; BYTP={}; TP={};
  saveSummary();
  CARDS.forEach(function(c){ BYID[c.i]=c; (BYTP[c.t]=BYTP[c.t]||[]).push(c); });
  TOPICS.forEach(function(t){ TP[t.c]=t; });
  return true;
}

/* ============ 保存 ============ */
var MEM={}, PERSIST='none';
function lget(k){ try{var v=localStorage.getItem(k); if(v!=null) return v;}catch(e){} return MEM[k]!=null?MEM[k]:null; }
function lset(k,v){ try{localStorage.setItem(k,v); return;}catch(e){} MEM[k]=v; }
var Store={
  get:function(k){ return Promise.resolve().then(function(){
    if(window.storage&&window.storage.get) return window.storage.get(k).then(function(r){PERSIST='claude';return r&&r.value!=null?r.value:null;},function(){return lget(k);});
    return lget(k); }); },
  set:function(k,v){ return Promise.resolve().then(function(){
    if(window.storage&&window.storage.set) return window.storage.set(k,v).then(function(){PERSIST='claude';},function(){lset(k,v);});
    lset(k,v); }); }
};
/* 教材は1科目1MB近いので localStorage では容量が足りない。IndexedDB に置く */
var IDB=null, IDBNG=false;
function db(){
  if(IDBNG) return Promise.reject();
  if(IDB) return Promise.resolve(IDB);
  return new Promise(function(res,rej){
    try{
      var q=indexedDB.open('trainer',1);
      q.onupgradeneeded=function(){ var d=q.result;
        if(!d.objectStoreNames.contains('cards')) d.createObjectStore('cards'); };
      q.onsuccess=function(){ IDB=q.result; res(IDB); };
      q.onerror=function(){ IDBNG=true; rej(); };
    }catch(e){ IDBNG=true; rej(); }
  });
}
function idb(mode,fn){
  return db().then(function(d){ return new Promise(function(res,rej){
    var tx=d.transaction('cards',mode), st=tx.objectStore('cards'), r=fn(st);
    tx.oncomplete=function(){ res(r&&r.result!==undefined?r.result:null); };
    tx.onerror=function(){ rej(); }; tx.onabort=function(){ rej(); };
  });});
}
var Cards={
  put:function(sig,txt){ return idb('readwrite',function(st){ return st.put(txt,sig); })
    .then(null,function(){ lset('trainer_cards_'+sig,txt); }); },
  get:function(sig){ return idb('readonly',function(st){ return st.get(sig); })
    .then(function(v){ return v||lget('trainer_cards_'+sig); },
          function(){ return lget('trainer_cards_'+sig); }); },
  del:function(sig){ return idb('readwrite',function(st){ return st.delete(sig); })
    .then(null,function(){}).then(function(){ try{localStorage.removeItem('trainer_cards_'+sig);}catch(e){} }); }
};
var SUBDUE={};
function subjects(){ try{ return JSON.parse(lget('trainer_subjects')||'[]'); }catch(e){ return []; } }
/* 各科目の「今日戻ってくる肢」の数を、教材を開かずに記録だけから数える */
function scanSubjects(){
  var a=subjects(), t=today();
  return Promise.all(a.map(function(sg){
    return Store.get('trainer_state_'+sg).then(function(v){
      var n=0;
      try{ var st=JSON.parse(v||'{}'); for(var k in (st.L||{})) if(st.L[k].due<=t) n++; }catch(e){}
      SUBDUE[sg]=n;
    },function(){ SUBDUE[sg]=0; });
  }));
}
function sumKey(sig){ return 'trainer_sum_'+sig; }
function saveSummary(){

/* 科目の「進み具合」を1つの数にする。古いもので上書きしないための目印 */
function activity(st){
  st=st||{};
  var n=0, ok=0, last=0, days=0;
  for(var d in (st.log||{})){
    var g=st.log[d]||{};
    n+=g.n||0; ok+=g.ok||0;
    if((g.n||0)&&+d>last) last=+d;
    if(g.n||0) days++;
  }
  var cards=0; for(var k in (st.L||{})) cards++;
  return {n:n, ok:ok, cards:cards, last:last, days:days};
}

function packText(obj){
  var txt=JSON.stringify(obj);
  if(!(window.CompressionStream&&window.Response)) return Promise.resolve(txt);
  try{
    var cs=new CompressionStream('gzip');
    var st=new Blob([txt]).stream().pipeThrough(cs);
    return new Response(st).arrayBuffer().then(function(buf){
      var b=new Uint8Array(buf), s2='';
      for(var i=0;i<b.length;i++) s2+=String.fromCharCode(b[i]);
      return 'TT1:'+btoa(s2);
    },function(){ return txt; });
  }catch(e){ return Promise.resolve(txt); }
}
function unpackText(txt){
  txt=String(txt||'').trim();
  if(txt.indexOf('TT1:')!==0) return Promise.resolve(JSON.parse(txt));
  var raw=atob(txt.slice(4)), b=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) b[i]=raw.charCodeAt(i);
  var ds=new DecompressionStream('gzip');
  var st=new Blob([b]).stream().pipeThrough(ds);
  return new Response(st).text().then(function(t){ return JSON.parse(t); });
}

    return Store.get('trainer_state_'+sg).then(function(v){

function migrateBackup(o){
  if(!o||!o.L) return o;
  var ks=Object.keys(o.L);
  if(!ks.length||!/^\d+$/.test(ks[0])) return o;      /* すでに今の形式 */
  var pad=function(k){ return 'K'+('0000'+k).slice(-4); };
  var L={},N={},cs={},log={},moved=0;
  ks.forEach(function(k){
    var v=o.L[k]||{}, st=Math.min(v.st||0,3), miss=v.miss||0;
    var n=miss+Math.max(st,1), ok=Math.max(0,n-miss);
    L[pad(k)]={st:st, ng:(st>0?0:Math.min(miss,3)), n:n, ok:ok,
               due:v.due||today(), last:v.last||today()};
    moved++;
  });
  for(var a in (o.N||{})) N[pad(a)]=o.N[a];
  for(var b in (o.cycSeen||{})) cs[pad(b)]=1;
  for(var c in (o.log||{})){ var x=o.log[c]||{}; log[c]={n:x.n||0,ok:x.ok||0,s:x.sec||x.s||0}; }
  var f=fresh();
  f.L=L; f.N=N; f.cycSeen=cs; f.log=log;
  f.cyc=o.cyc||7; f.cycStart=(o.cycStart!=null?o.cycStart:today());
  f.rounds=o.rounds||0; f.rank=o.rank||'AB'; f.mix=o.mix||'freq';
  f.rt=o.rt||'on'; f.examStr=o.examStr||null; f.pool='mon';
  f._moved=moved;
  return f;
}

function exams(){

function poolOk(c){
  if(S.pool==='mon') return !c.k;
  if(S.pool==='kako') return !!c.k;
  return true;
}
function pool(id){ for(var i=0;i<M.pools.length;i++) if(M.pools[i].id===id) return M.pools[i]; return null; }
function poolCount(id){ return CARDS.filter(function(c){
  return id==='mon'?!c.k:(id==='kako'?!!c.k:true); }).length; }
function rankOk(c){ return S.rank==='A'?c.r==='Ａ':S.rank==='AB'?c.r!=='Ｃ':true; }
var _hot=null;
function hotSet(){
  if(_hot) return _hot;
  var ts=TOPICS.slice().sort(function(a,b){ return b.w-a.w; });
  var tot=0; ts.forEach(function(t){ tot+=t.w; });
  var acc=0; _hot={};
  for(var i=0;i<ts.length;i++){ if(acc>=tot*0.8) break; acc+=ts[i].w; _hot[ts[i].c]=1; }
  return _hot;
}
function hotOk(c){ return S.hot?!!hotSet()[c.t]:true; }
function inPool(c){ return poolOk(c)&&rankOk(c)&&hotOk(c); }
function poolCards(){ return CARDS.filter(inPool); }
function poolTotal(){ return poolCards().length; }

function weightOf(c){
  var t=TP[c.t], w=1;
  w += (t? t.w/MAXW : 0)*3.2;                 /* 過去10回の出題実績（Ａ5点Ｂ3点） */
  w += (t? t.hi/10 : 0)*1.4;                  /* 何回の試験に顔を出したか */
  w += c.r==='Ａ'?1.5:(c.r==='Ｂ'?0.6:0);      /* 教材の重要性 */
  w += c.s?0.8:0;                              /* ★＝複数回出題 */
  if(c.y2&&c.y2>=2023) w+=0.7;                 /* 直近の出題 */
  if(c.k&&c.mk==='◎') w+=1.0;                 /* 85%が見抜けた＝落とせない */
  if(c.k&&c.ac!=null&&c.ac>=65) w+=0.5;
  return w;
}
function wpick(pool,n){
  var a=pool.slice(), out=[];
  var ws=a.map(weightOf), tot=ws.reduce(function(x,y){return x+y;},0);
  while(out.length<n&&a.length){
    var r=Math.random()*tot, i=0;
    while(i<a.length-1&&r>ws[i]){ r-=ws[i]; i++; }
    out.push(a[i]); tot-=ws[i]; a.splice(i,1); ws.splice(i,1);
  }
  return out;
}
function dueList(){ var t=today(),o=[]; for(var k in S.L){ var c=BYID[k]; if(c&&inPool(c)&&S.L[k].due<=t) o.push(c); } return o; }
function newPool(){ return poolCards().filter(function(c){ return !S.L[c.i]&&!S.cycSeen[c.i]; }); }

/* ============ 周回ペース ============ */
function cycState(){
  var total=poolTotal(), seen=0;
  for(var k in S.cycSeen) if(BYID[k]&&inPool(BYID[k])) seen++;
  var dayIn=Math.max(1,today()-(S.cycStart||today())+1);
  var daysLeft=Math.max(1,cyc()-dayIn+1);
  var remain=Math.max(0,total-seen);
  var over=Math.max(0,dayIn-cyc());
  var per=Math.ceil(remain/daysLeft)||1;
  var capv=Math.min(per,Math.ceil(total/cyc())*2);
  return {total:total,seen:seen,dayIn:dayIn,daysLeft:daysLeft,remain:remain,over:over,perDay:capv};
}
function cap(){ return Math.max(1,cycState().perDay); }
function setCycle(n){
  var old=cyc();
  if(n===old){ S.cyc=n; return; }
  var st=cycState();
  S.cyc=n;
  /* いまの進み具合と同じ位置に、新しい周期の何日目かを合わせる */
  var prog=st.total?st.seen/st.total:0;
  var dayIn=Math.max(1,Math.min(n,Math.floor(n*prog)+1));
  S.cycStart=today()-dayIn+1;
  /* 短くしたときは、先に予約済みの復習も新しい周期の中に引き寄せる */
  if(n<old){
    var lim=today()+n;
    for(var k in S.L) if(S.L[k].due>lim) S.L[k].due=lim;
  }
}
function repeatEst(){ var d=dueList().length; return Math.min(d,Math.round(cap()*0.45)); }
function doneToday(){ var l=S.log[today()]; return l?l.n:0; }
function budget(){ return Math.max(0,cap()-doneToday()); }
function markSeen(id){
  var c=cycState();
  if(c.remain<=0&&c.dayIn>=cyc()){
    S.rounds=(S.rounds||0)+1; S.cycStart=today(); S.cycSeen={}; S.cycFirst=null;
  }
  if(!S.cycFirst) S.cycFirst=today();   /* 遅れは「解き始めた日」から数える */
  S.cycSeen[id]=1;
}
function examDay(){ if(!S.examStr) return null; var d=new Date(S.examStr+'T00:00:00'); if(isNaN(d)) return null;
  return Math.floor(d.getTime()/864e5); }

function secPer(){
  var t=0,n=0,d=today();
  for(var k in S.log){ if(d-k>14) continue; t+=S.log[k].s||0; n+=S.log[k].n||0; }
  if(n<=8){ t=0; n=0; for(var k2 in S.log){ t+=S.log[k2].s||0; n+=S.log[k2].n||0; } }
  return n>8?Math.max(6,Math.min(45,t/n)):26;
}
function mins(n){ return Math.max(1,Math.round(n*secPer()/60)); }

/* ============ セッション ============ */
var MODES={
  today:{nm:'今日のぶん'}, half:{nm:'半分だけ'}, one:{nm:'1分だけ'},
  rev:{nm:'復習だけ'}, more:{nm:'もう少し'}, topic:{nm:'論点'},
  weak:{nm:'弱点つぶし'}, cz:{nm:'直前チェック'}, note:{nm:'メモのある肢'}, must:{nm:'落とせない肢'}
};
function planLists(total,opt){
  opt=opt||{}; var t=today(), due=[],neu=[],again=[];
  var base=opt.pool||poolCards();
  base.forEach(function(c){
    var L=S.L[c.i];
    if(L){ if(L.due<=t){ (L.ng?again:due).push(c); } }
    else if(!S.cycSeen[c.i]) neu.push(c);
  });
  again.sort(function(a,b){ return (S.L[b.i].ng||0)-(S.L[a.i].ng||0); });
  var pick=function(a,n){ return n<=0?[]:(S.mix==='freq'?wpick(a,n):shuf(a).slice(0,n)); };

  /* 復習と新規の割合は、その日の予定（1日◯肢＋戻ってきた◯肢）に合わせる。
     短いセッションでも同じ割合になるので、「前日と同じ問題ばかり」にならない。 */
  var revAvail=again.length+due.length, newAvail=neu.length, pRev;
  if(!revAvail) pRev=0;
  else if(!newAvail || opt.norev) pRev=1;
  else {
    var perDay=cap(), rep=Math.min(revAvail, Math.round(perDay*0.45));
    pRev=rep/(rep+perDay);
    if(pRev<0.20) pRev=0.20;
    if(pRev>0.50) pRev=0.50;
  }
  var nRev=Math.min(revAvail, Math.round(total*pRev));
  if(revAvail && nRev<1 && total>=3) nRev=1;          /* 少なくとも1肢は復習を混ぜる */

  var out=[];
  var nAgain=Math.min(again.length, Math.ceil(nRev*0.6));   /* 外した肢を先に */
  out=out.concat(again.slice(0,nAgain));
  out=out.concat(pick(due, Math.min(due.length, nRev-out.length)));
  if(out.length<nRev) out=out.concat(again.slice(nAgain, nAgain+(nRev-out.length)));

  var rest=total-out.length;
  if(rest>0) out=out.concat(pick(neu,rest));

  if(out.length<total){            /* 片方が尽きたらもう片方で埋める */
    var used={}; out.forEach(function(c){ used[c.i]=1; });
    var extra=again.concat(due).concat(neu).filter(function(c){ return !used[c.i]; });
    out=out.concat(pick(extra,total-out.length));
  }
  if(out.length<total&&!opt.norev){
    var used2={}; out.forEach(function(c){ used2[c.i]=1; });
    var ex2=base.filter(function(c){ return !used2[c.i]; });
    out=out.concat(pick(ex2,total-out.length));
  }
  return shuf(out).slice(0,total);
}
function planCounts(total,opt){
  var l=planLists(total,opt), t=today(), r={all:l.length,fresh:0,neu:0,again:0};
  l.forEach(function(c){ var L=S.L[c.i]; if(!L) r.neu++; else if(L.ng) r.again++; else r.fresh++; });
  return r;
}
function shuf(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

function startSession(mode,arg){
  var q=[];
  if(mode==='today') q=planLists(Math.max(1,budget()));
  else if(mode==='half') q=planLists(Math.max(1,Math.round(budget()*0.5)));
  else if(mode==='one') q=planLists(5);
  else if(mode==='more') q=planLists(Math.max(5,Math.round(cap()*0.5)));
  else if(mode==='rev') q=planLists(Math.max(1,budget()),{norev:true});
  else if(mode==='topic') q=shuf(BYTP[arg]||[]).filter(poolOk).slice(0,30);
  else if(mode==='note'){ var ids=Object.keys(S.N||{}).filter(function(k){return S.N[k];});
    q=shuf(ids.map(function(i){return BYID[i];}).filter(Boolean)).slice(0,30); }
  else if(mode==='weak'){ q=weakCards().slice(0,20); }
  else if(mode==='must'){ q=shuf(CARDS.filter(function(c){ return c.k&&c.mk==='◎'; })).slice(0,20); }
  else if(mode==='cz'){ var tt=[]; CZ.forEach(function(x){ if(x.id===arg) tt=x.topics||[]; }); var pool=[];
    tt.forEach(function(x){ (BYTP[x]||[]).forEach(function(c){ pool.push(c); }); });
    q=wpick(pool,Math.min(25,pool.length)); }
  if(!q.length){ toast('出す肢がありません'); return; }
  ses={mode:mode,arg:arg,queue:q,i:0,graded:false,pick:null,ok:0,ng:0,miss:[],
       t0:Date.now(),sec:0,rstart:undefined,kan:0};
  tmp={}; view='card'; saveSes(); render();
}
function saveSes(){ if(!ses){S.ses=null;save();return;}
  S.ses={m:ses.mode,arg:ses.arg,q:ses.queue.map(function(c){return c.i;}),i:ses.i,
    ok:ses.ok,ng:ses.ng,miss:ses.miss,sec:ses.sec,rstart:ses.rstart,kan:ses.kan}; save(); }
function resumable(){ var r=S.ses; if(!r||!r.q||r.i>=r.q.length) return null; return r; }
function resumeSession(){ var r=S.ses; if(!r) return;
  ses={mode:r.m,arg:r.arg,queue:r.q.map(function(i){return BYID[i];}).filter(Boolean),
    i:r.i,graded:false,pick:null,ok:r.ok||0,ng:r.ng||0,miss:r.miss||[],t0:Date.now(),
    sec:r.sec||0,rstart:r.rstart,kan:r.kan||0};
  tmp={}; view='card'; render(); }

function grade(id,good){
  var t=today(), L=S.L[id]||{st:0,ng:0,n:0,ok:0};
  L.n=(L.n||0)+1;
  if(good){ L.ok=(L.ok||0)+1; L.st=Math.min((L.st||0)+1,3); L.ng=0; }
  else { L.ng=(L.ng||0)+1; L.st=0; }
  var st=STEPS();

  save();
}

function topicStat(code){
  var cs=(BYTP[code]||[]).filter(poolOk), n=0,ok=0,seen=0;
  cs.forEach(function(c){ var L=S.L[c.i]; if(L){ seen++; n+=L.n||0; ok+=L.ok||0; } });
  return {total:cs.length,seen:seen,n:n,ok:ok,rate:n?ok/n:null};
}
function weakCards(){
  var out=[];
  CARDS.forEach(function(c){ if(!inPool(c))return; var L=S.L[c.i]; if(!L)return;
    var miss=(L.n||0)-(L.ok||0); if(miss<=0)return;
    out.push({c:c,sc:miss*2+(L.ng||0)*3+weightOf(c)});
  });
  out.sort(function(a,b){return b.sc-a.sc;});
  return out.map(function(x){return x.c;});
}
function weakTopics(){
  var o=[];
  TOPICS.forEach(function(t){
    var s=topicStat(t.c); if(!s.total) return;
    var hz=t.w/MAXW;
    var risk=(s.rate===null?0.45:(1-s.rate))*hz;
    o.push({t:t,s:s,hz:hz,risk:risk});
  });
  o.sort(function(a,b){return b.risk-a.risk;});
  return o;
}

/* ============ 描画ユーティリティ ============ */
function sentences(t){
  t=String(t||''); var out=[], cur='';
  for(var i=0;i<t.length;i++){ cur+=t[i]; if(t[i]==='。'){ out.push(cur); cur=''; } }
  if(cur.replace(/\s/g,'')) out.push(cur);
  return out;
}
var LEAD=/^(一方|ただし|なお|また|さらに|逆に|これに対し|次に|そのため|したがって|だから|つまり|要は|結果として|ここが|この点)/;
function paras(ss){
  var out=[], cur=[], len=0;
  for(var i=0;i<ss.length;i++){
    var s=ss[i].t;
    if(cur.length && (len>=88 || (LEAD.test(s) && len>=45))){ out.push(cur); cur=[]; len=0; }
    cur.push(ss[i]); len+=s.length;
  }
  if(cur.length) out.push(cur);
  return out;
}
function gram(s){
  s=String(s||'').replace(/[\s、。，．・「」『』（）()\[\]〔〕【】：:／/]/g,'');
  var o={}, n=0;
  for(var i=0;i<s.length-1;i++){
    var b=s.substr(i,2);
    if(/[\u4E00-\u9FFF\u30A0-\u30FFA-Za-z0-9]/.test(b) && !o[b]){ o[b]=1; n++; }
  }
  return {g:o,n:n};
}
function cover(cg,txt){
  var b=gram(txt); if(!b.n) return 0;
  var hit=0; for(var k in b.g) if(cg.g[k]) hit++;
  return hit/b.n;
}
/* その肢に対応する解説の箇所を選ぶ。最大2つ、無理に選ばない */
function relevant(c,items){
  var cg=gram(c.q+' '+(c.w||''));
  var sc=[], mx=0;
  for(var i=0;i<items.length;i++){ var v=cover(cg,items[i]); sc.push({s:v,i:i}); if(v>mx) mx=v; }
  if(mx<0.30) return {n:0,map:{}};
  var lim=Math.max(0.30,mx*0.85);
  sc.sort(function(a,b){ return b.s-a.s; });
  var map={}, n=0;
  for(var j=0;j<sc.length&&n<2;j++){ if(sc[j].s>=lim){ map[sc[j].i]=1; n++; } }
  return {n:n,map:map};
}
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[m];}); }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.className='toast on';
  clearTimeout(toast._t); toast._t=setTimeout(function(){t.className='toast';},1500); }
function fmt(sec){ sec=Math.round(sec||0); var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);
  if(h) return h+'時間'+m+'分'; if(m) return m+'分'; return sec+'秒'; }
function timeStats(){ var t=today(),d=0,w=0,a=0,days=0;
  for(var k in S.log){ var s=S.log[k].s||0; a+=s; if(s)days++; if(+k===t)d=s; if(t-k<7)w+=s; }
  return {day:d,week:w,all:a,days:days}; }
function stairCounts(){ var c=[0,0,0];
  for(var k in S.L){ if(!BYID[k]||!inPool(BYID[k]))continue; var st=S.L[k].st||0;
    c[Math.max(0,Math.min(st,3)-1)]++; } return c; }

  if(t&&t.hi===0) return '出題実績なし';

function monRate(){

function stage2(){

var ALL=null;
function loadAll(){
  var a=subjects();
  return Promise.all(a.map(function(sg){
    return ensureSummary(sg).then(function(sm){
      return Store.get('trainer_state_'+sg).then(function(v){
        var st={}; try{ st=JSON.parse(v||'{}'); }catch(e){}
        return {sig:sg, sum:sm||getSummary(sg), st:st};
      },function(){ return {sig:sg, sum:sm||getSummary(sg), st:{}}; });
    });
  })).then(function(rs){
    /* いま開いている科目は、保存待ちの分があるので手元の記録をそのまま使う */
    rs.forEach(function(r){ if(r.sig===M.sig) r.st=S; });
    ALL=rs; return rs;
  });
}
function subjStat(x){
  var st=x.st||{}, sm=x.sum, t=today();
  var rank=st.rank||'AB', pool=st.pool||'mon';
  var total=sm?poolRankTotal(sm,pool,rank):0;
  var L=st.L||{}, started=0, n=0, ok=0;
  for(var k in L){ started++; n+=L[k].n||0; ok+=L[k].ok||0; }
  var seen=0, cs=st.cycSeen||{};
  for(var k2 in cs) seen++;
  var cyc=st.cyc||7;
  var dayIn=(st.cycStart!=null)?Math.max(1,t-st.cycStart+1):0;
  var prog=total?Math.min(1,seen/total):0;
  /* この周でまだ1肢も解いていないうちは遅れを出さない。
     解き始めていれば、その日を起点に数える（周が明けた直後に遅れ扱いされないように） */
  var first=(st.cycFirst!=null)?st.cycFirst:st.cycStart;
  var workDays=(seen&&first!=null)?Math.max(1,t-first+1):0;
  var lag=(seen&&workDays&&cyc&&total)?(workDays-cyc*prog):null;
  var day=0,wk=0,tot=0,days=0,last=null;
  for(var d in (st.log||{})){
    var g=st.log[d]||{}, sec=g.s||0;
    tot+=sec; if(sec)days++;
    if(+d===t) day+=sec;
    if(t-d<7) wk+=sec;
    if(sec&&(last===null||+d>last)) last=+d;
  }
  var dl=null;
  if(st.examStr){ var dd=new Date(st.examStr+'T00:00:00');
    if(!isNaN(dd)) dl=Math.floor(dd.getTime()/864e5)-t; }
  return {sig:x.sig, title:(sm&&sm.title)||x.sig, ver:sm&&sm.v, cards:sm?sm.n:0,
    topics:sm?sm.t:0, total:total, started:started, seen:seen, prog:prog,
    cyc:cyc, dayIn:dayIn, lag:lag, workDays:workDays, rate:n?ok/n:null, due:SUBDUE[x.sig]||0,
    day:day, wk:wk, tot:tot, days:days, last:last, dl:dl,
    rounds:st.rounds||0, rank:rank, noData:!sm};
}
function dayLabel(d){
  var dt=new Date(d*864e5);
  return (dt.getMonth()+1)+'/'+dt.getDate()+'（'+'日月火水木金土'[dt.getDay()]+'）';
}
function timeText(days){
  var t=today(), lines=[], S2=(ALL||[]).map(subjStat);
  for(var i=days-1;i>=0;i--){
    var d=t-i, parts=[], sum=0;
    (ALL||[]).forEach(function(x){
      var g=(x.st&&x.st.log&&x.st.log[d])||null, sec=g?(g.s||0):0;
      if(sec){ parts.push(((x.sum&&x.sum.title)||x.sig).replace(' すきまトレーナー','')+' '+Math.round(sec/60)+'分'); sum+=sec; }
    });
    if(sum) lines.push(dayLabel(d)+'  合計'+Math.round(sum/60)+'分　'+parts.join(' / '));
  }
  return lines.length?lines.join('\n'):'まだ記録がありません。';
}

  h+='<div style="margin-top:10px">';
  S2.forEach(function(x){
    if(!x.day&&!x.wk) return;

document.addEventListener('click',function(e){
  var el=e.target.closest('button'); if(!el) return;
  var d=el.dataset;
  if(d.go){
    if(d.go==='home'){ stopSpeak(); view='home'; ses=ses&&view==='card'?ses:ses; render(); return; }
    if(d.go==='pick'){ view='pick'; render(); return; }
    if(d.go==='czhome'){ view='cz'; render(); return; }
    if(d.go==='all'){ ALL=null; view='all'; tmp={}; scanSubjects().then(loadAll).then(render); return; }
    if(d.go==='weak'){ view='weak'; render(); return; }
    if(d.go==='dash'){ view='dash'; render(); return; }
    if(d.go==='resume'){ resumeSession(); return; }
    if(d.go==='reload'){ tmp={}; view='load'; render(); return; }
    startSession(d.go); return;
  }
  if(d.subj){ if(d.subj!==M.sig){ switchTo(d.subj).then(scanSubjects).then(render); } return; }
  if(d.dropsubj){
    if(confirm(d.dropsubj+' の教材を削除します。学習記録は残ります。よろしいですか？')){
      var others=subjects().filter(function(x){return x!==d.dropsubj;});
      dropSubject(d.dropsubj).then(function(){
        if(others.length) return switchTo(others[0]);
        CARDS=[]; TOPICS=[]; M={}; view='load'; render();
      }).then(scanSubjects).then(render);
    } return; }
  if(d.subj2){ ALL=null; if(d.subj2!==M.sig){ switchTo(d.subj2).then(scanSubjects).then(render); } else { view='home'; render(); } return; }
  if(d.tc){
    if(d.tc==='open'){ tmp.tcopy=1; render(); return; }
    if(d.tc==='close'){ tmp.tcopy=0; render(); return; }
    if(d.tc==='copy'){ var x=document.getElementById('tc'); x.select();
      try{ document.execCommand('copy'); toast('コピーしました'); }catch(e){ toast('長押しでコピーしてください'); } return; }
  }
  if(d.topic){ startSession('topic',d.topic); return; }
  if(d.cz){ startSession('cz',d.cz); return; }
  if(d.psort){ tmp.psort=d.psort; render(); return; }
  if(d.pool){ S.pool=d.pool; if(d.pool!=='mon') S.s2dis=1; save(); render(); return; }
  if(d.s2){ S.s2dis=1; save(); toast('問題集に集中します'); render(); return; }
  if(d.rank){ S.rank=d.rank; save(); render(); return; }
  if(d.mix){ S.mix=d.mix; save(); render(); return; }
  if(d.hot!==undefined){ S.hot=+d.hot; save(); render(); return; }
  if(d.cyc){ setCycle(+d.cyc); save(); render(); return; }
  if(d.rt){ S.rt=d.rt; save(); render(); return; }
  if(d.tts!==undefined){ S.tts=+d.tts; save(); if(!S.tts)stopSpeak(); render(); return; }
  if(d.rate){ S.ttsRate=Math.max(0.6,Math.min(1.8,(S.ttsRate||1.05)+(d.rate==='+'?0.15:-0.15)));
    save(); render(); return; }
  if(d.pick!==undefined){ answer(+d.pick); return; }
  if(d.next){ nextCard(); return; }
  if(d.guess){ markGuess(); return; }
  if(d.sh){ tmp.sh=!tmp.sh; render(); return; }
  if(d.sh2){ tmp.sh2=!tmp.sh2; render(); return; }
  if(d.shfull){ tmp.shfull=!tmp.shfull; render(); return; }
  if(d.say){
    var c=ses&&ses.queue[ses.i]; if(!c) return;
    if(d.say==='k'){ var t=TP[c.t]; speak(t.kk+' '+t.kw); return; }
    if(d.say==='s'){ var ks=(c.sh||[]).filter(function(x){ return SH[x]; });
      if(ks.length){ var e=SH[ks[0]]; speak(tmp.shfull?(e.t||e.e):(e.e||e.t)); } return; }
    speak(c.q+(ses.graded?('。'+explainText(c)):''));
    return;
  }
  if(d.ask){
    if(d.ask==='open'){ tmp.ask=1; render(); return; }
    if(d.ask==='close'){ tmp.ask=0; render(); return; }
    if(d.ask==='copy'){ var a=document.getElementById('ask'); a.select();
      try{ document.execCommand('copy'); toast('コピーしました'); }catch(e){ toast('長押しでコピーしてください'); } return; }
  }
  if(d.note){
    var c=ses.queue[ses.i];
    if(d.note==='edit'){ tmp.note=1; render(); setTimeout(function(){var x=document.getElementById('nt'); if(x)x.focus();},40); return; }
    if(d.note==='cancel'){ tmp.note=0; render(); return; }
    if(d.note==='save'){ var v=document.getElementById('nt').value.trim();
      S.N=S.N||{}; if(v)S.N[c.i]=v; else delete S.N[c.i]; save(); tmp.note=0; toast('保存しました'); render(); return; }
    if(d.note==='del'){ delete S.N[c.i]; save(); tmp.note=0; render(); return; }
  }
  if(d.ex){
    if(d.ex==='set'){ var v=document.getElementById('exd').value; S.examStr=v||null; save(); render(); return; }
    if(d.ex==='clr'){ S.examStr=null; save(); render(); return; }
  }
  if(d.exp){
    if(d.exp==='copy2'){
      toast('まとめています…');
      bundle().then(packText).then(function(txt){
        var done=function(okc){ toast(okc?('コピーしました（'+Math.round(txt.length/1024)+'KB）'):'コピーできませんでした'); };
        if(navigator.clipboard&&navigator.clipboard.writeText)
          navigator.clipboard.writeText(txt).then(function(){ done(1); },function(){ tmp.exp=1; tmp.expText=txt; render(); });
        else { tmp.exp=1; tmp.expText=txt; render(); }
      });
      return;
    }
    if(d.exp==='open'){ toast('まとめています…');
      bundle().then(packText).then(function(txt){ tmp.expText=txt; tmp.exp=1; render(); }); return; }
    if(d.exp==='close'){ tmp.exp=0; render(); return; }
    if(d.exp==='copy'){ var x=document.getElementById('ex'); x.select();
      try{ document.execCommand('copy'); toast('コピーしました'); }catch(e){ toast('長押しでコピーしてください'); } return; }
  }
  if(d.imp){
    if(d.imp==='open'){ tmp.imp=1; render(); return; }
    if(d.imp==='close'){ tmp.imp=0; render(); return; }
    if(d.imp==='do'){
      var raw=document.getElementById('im').value;
      unpackText(raw).then(function(o){
        if(o&&o.tt&&o.subjects){                       /* 全科目まとめ */
          compare(o).then(function(rows){ tmp.cmp={inc:o,rows:rows}; tmp.imp=0; render(); });
          return;
        }
        throw 0;                                        /* 旧来の1科目ぶんは下へ */
      }).then(null,function(){ imp1(raw); });
      return; }
    if(0){ try{ var o=migrateBackup(JSON.parse(document.getElementById('im').value));
      if(!o.L) throw 0;
      var mv=o._moved; delete o._moved;
      S=o; var f=fresh(); for(var k in f) if(S[k]===undefined) S[k]=f[k];
      S.ses=null; save(); tmp.imp=0;
      toast(mv?('旧アプリの'+mv+'肢を取り込みました'):'読み込みました');
      render(); }catch(e){ toast('読み込めませんでした'); } return; }
  }
  if(d.cmp){
    if(d.cmp==='close'){ tmp.cmp=null; render(); return; }
    var inc=tmp.cmp.inc, rows=tmp.cmp.rows;
    var only=(d.cmp==='safe')?rows.filter(function(r){ return r.state==='fwd'||r.state==='new'; })
                                  .map(function(r){ return r.sig; }):null;
    if(only&&!only.length){ toast('取り込む科目がありません'); return; }
    applyBundle(inc, only).then(function(){
      tmp.cmp=null; ALL=null;
      var n=only?only.length:rows.length;
      toast(n+'科目を取り込みました');
      scanSubjects().then(render, render);
    });
    return;
  }
  if(d.ver){
    if(d.ver==='log'){ tmp.vlog=!tmp.vlog; render(); return; }
    if(d.ver==='up'){
      toast('最新を取りに行きます');
      var done=function(){ try{ location.reload(true); }catch(e){ location.reload(); } };
      try{
        var jobs=[];
        if(window.caches&&caches.keys) jobs.push(caches.keys().then(function(ks){
          return Promise.all(ks.map(function(k){ return caches.delete(k); })); }));
        if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)
          jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){
            return Promise.all(rs.map(function(r){ return r.unregister(); })); }));
        if(jobs.length) Promise.all(jobs).then(done,done); else done();
      }catch(e){ done(); }
      return;
    }
  }
  if(d.treset){ if(confirm('学習時間の記録だけを消します。解いた記録は残ります。よろしいですか？')){
      for(var lk in S.log) S.log[lk].s=0; if(ses) ses.sec=0; save(); toast('時間の記録を消しました'); render(); } return; }
  if(d.reset){ if(confirm('学習記録を全部消します。よろしいですか？')){ S=fresh(); S.cycStart=today(); save(); toast('消しました'); render(); } return; }
});
document.addEventListener('change',function(e){
  if(e.target&&e.target.id==='pick'&&e.target.files&&e.target.files[0]) acceptFile(e.target.files[0]);
});
document.addEventListener('keydown',function(e){
  if(view!=='card'||!ses) return;
  if(!ses.graded){ if(e.key==='1'||e.key==='o')answer(1); if(e.key==='2'||e.key==='x')answer(0); if(e.key==='3'||e.key==='?')answer(2); }
  else if(e.key==='Enter'||e.key===' ') nextCard();
});
function flush(){ if(saveT){ clearTimeout(saveT); saveT=null; }
  try{ Store.set(KEY,JSON.stringify(S)); }catch(e){} }
if(typeof document!=='undefined'&&document.addEventListener){
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ tick(); flush(); } else { resume(); } });
}
if(typeof window!=='undefined'&&window.addEventListener){
  window.addEventListener('pagehide',function(){ tick(); flush(); });
  window.addEventListener('blur',function(){ tick(); flush(); });
  window.addEventListener('focus',resume);
  window.addEventListener('pageshow',resume);
}
setInterval(function(){ if(view==='card'&&ses) tick(); },5000);
function migrate(){
  /* 旧バージョン（1科目だけを1か所に置いていた頃）からの引き継ぎ */
  if(subjects().length) return Promise.resolve();
  return Store.get('trainer_cards_v1').then(function(v){
    if(!v) return Store.get('kansa_cards_v1');
    return v;
  },function(){ return null; }).then(function(v){
    if(!v) return;
    try{
      var d=JSON.parse(v), sg=(d.meta||{}).sig;
      if(!sg) return;
      return Cards.put(sg,v).then(function(){ addSubject(sg); });
    }catch(e){}
  },function(){});
}
function deepLink(){
  try{
    var q=(location.search||'').match(/[?&]s=([^&]+)/);
    if(!q) return null;
    var want=decodeURIComponent(q[1]);
    var a=subjects();
    for(var i=0;i<a.length;i++) if(a[i]===want||a[i].indexOf(want)>=0) return a[i];
  }catch(e){}
  return null;
}
function brand(sig){
  /* ホーム画面に追加したときのアイコンと名前を、科目に合わせる */
  var map={'監査論':'kansa','財務理論':'zaimu','管理理論':'kanri','企業法':'kigyo'};
  var k=map[sig]; if(!k) return;
  try{
    var l=document.querySelector('link[rel="apple-touch-icon"]');
    if(l) l.href='./icon-'+k+'-180.png';
    var i=document.querySelector('link[rel="icon"]');
    if(i) i.href='./icon-'+k+'-192.png';
    var t=document.querySelector('meta[name="apple-mobile-web-app-title"]');
    if(t) t.content=sig;
    document.title=sig+' すきまトレーナー';
  }catch(e){}
}
probe()
 .then(migrate)
 .then(function(){
    var a=subjects();
    if(!a.length){ view='load'; render(); return; }
    var want=deepLink()||lget('trainer_last')||a[0];
    if(a.indexOf(want)<0) want=a[0];
    return openSubject(want).then(function(ok){
      if(!ok){ view='load'; render(); return; }
      lset('trainer_last',want);
      brand(want);
      return load().then(scanSubjects).then(function(){ view='home'; render(); });
    });
 })
 .then(null,function(){ view='load'; render(); });
})();

</script>

  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
